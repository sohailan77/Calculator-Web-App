<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator-Web-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="Cal-fav-icon.png">
</head>

<body class="">
    <main>
        <div class="main-container">
            <div class="display">
                <input id="input" type="text" >
            </div>
            <div class="buttons-container">
                <button class="grey-btn">C</button>
                <button class="grey-btn">+/-</button>
                <button class="grey-btn">%</button>
                <button class="blue-btn">÷</button>
                <button class="d-btn">7</button>
                <button class="d-btn">8</button>
                <button class="d-btn">9</button>
                <button class="blue-btn">×</button>
                <button class="d-btn">4</button>
                <button class="d-btn">5</button>
                <button class="d-btn">6</button>
                <button class="blue-btn">-</button>
                <button class="d-btn">1</button>
                <button class="d-btn">2</button>
                <button class="d-btn">3</button>
                <button class="blue-btn">+</button>
                <button class="d-btn">.</button>
                <button class="d-btn">0</button>
                <button class="d-btn">⌫</button>
                <button class="blue-btn">=</button>
            </div>
        </div>
    </main>

</body>

</html>
