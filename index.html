<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator-Web-App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="Cal-fav-icon.png">
</head>

<body class="">
    <main>
        <div class="main-container">
            <div class="display">
                <input id="input" type="text" >
            </div>
            <div class="buttons-container">
                <button class="grey-btn" data-value="*">C</button>
                <button class="grey-btn" data-value="back">⌫</button>
                <button class="grey-btn" data-value="%">%</button>
                <button class="blue-btn" data-value="/">÷</button>
                <button class="d-btn" data-value="7">7</button>
                <button class="d-btn" data-value="8">8</button>
                <button class="d-btn" data-value="9">9</button>
                <button class="blue-btn" data-value="*">×</button>
                <button class="d-btn" data-value="4">4</button>
                <button class="d-btn" data-value="5">5</button>
                <button class="d-btn" data-value="6">6</button>
                <button class="blue-btn" data-value="-">-</button>
                <button class="d-btn" data-value="1">1</button>
                <button class="d-btn" data-value="2">2</button>
                <button class="d-btn" data-value="3">3</button>
                <button class="blue-btn" data-value="+">+</button>
                <button class="d-btn" data-value="( )">( )</button>
                <button class="d-btn" data-value="0">0</button>
                <button class="d-btn" data-value=".">.</button>
                <button class="blue-btn" data-value="=">=</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
